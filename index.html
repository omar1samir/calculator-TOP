<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="calculator.js" defer></script>
    <title>Document</title>
</head>

<body>
    <div class="calc-interface">
        <div class="screen">
            <div class="screen-last">10 x</div>
            <div class="screen-current">10</div>
        </div>

        <div class="button-container">
            <!-- add an id for each button -->
            <!-- add the class "digit" to all the digits -->
            <div class="row controls">
                <button class="control-btn" id="btn-clear">CLEAR</button>
                <button class="control-btn" id="btn-backspace">BACKSPACE</button>
            </div>
            <div class="row">
                <button id="btn-7" class="digit">7</button>
                <button id="btn-8" class="digit">8</button>
                <button id="btn-9" class="digit">9</button>
                <button id="btn-divide">÷</button>
            </div>
            <div class="row">
                <button id="btn-4" class="digit">4</button>
                <button id="btn-5" class="digit">5</button>
                <button id="btn-6" class="digit">6</button>
                <button id="btn-multiply">&times;</button>
            </div>
            <div class="row">
                <button id="btn-1" class="digit">1</button>
                <button id="btn-2" class="digit">2</button>
                <button id="btn-3" class="digit">3</button>
                <button id="btn-subtract">-</button>
            </div>
            <div class="row">
                <button id="btn-0" class="digit">0</button>
                <button id="btn-dot">.</button>
                <button id="btn-equals">=</button>
                <button id="btn-add">+</button>
            </div>
        </div>
    </div>
</body>

</html>
